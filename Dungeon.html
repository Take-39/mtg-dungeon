<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG パイオニア ダンジョンカウンター</title>
    
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #00adb5;
            --danger-color: #ff2e63;
            --success-color: #28a745;
        }
        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
        }
        .tabs { display: flex; gap: 5px; margin-bottom: 12px; width: 100%; }
        .tab {
            flex: 1; padding: 12px 5px; background-color: #333; color: #aaa;
            border: none; border-radius: 5px; font-size: 12px; font-weight: bold;
        }
        .tab.active { background-color: var(--accent-color); color: white; }
        .card { background-color: var(--card-bg); border-radius: 10px; padding: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        .counter-area {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 8px;
        }
        .status-text {
            font-size: 14px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .status-uncleared { background-color: #444; color: #ccc; }
        .status-cleared { background-color: rgba(40, 167, 69, 0.2); color: var(--success-color); border: 1px solid var(--success-color); }

        .map-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 300 / 420;
            margin: 10px 0;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
        }
        .bg-card-img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }
        .marker-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 300px;
            height: 420px;
            transform-origin: top left;
            pointer-events: none;
        }
        .marker {
            position: absolute;
            border: 3.5px solid #ff2e63;
            background-color: rgba(255, 46, 99, 0.22);
            box-shadow: 0 0 10px #ff2e63;
            box-sizing: border-box;
            display: none;
        }

        .btn { padding: 10px 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-primary { background-color: var(--accent-color); color: white; width: 100%; font-size: 16px; padding: 14px; margin-top: 6px; text-align: left; }
        
        .btn-clear-dungeon { background-color: var(--success-color); color: white; width: 100%; font-size: 16px; padding: 14px; margin-top: 6px; text-align: center; }
        .btn-debug { background-color: #e67e22; color: white; width: 100%; font-size: 14px; padding: 10px; margin-top: 6px; text-align: center; }

        .lock-notice {
            color: var(--danger-color);
            background-color: rgba(255, 46, 99, 0.1);
            border: 1px solid var(--danger-color);
            padding: 12px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            margin-top: 6px;
        }

        .toast {
            position: fixed;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background-color: rgba(40, 167, 69, 0.95);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab active" onclick="switchDungeon('phandelver')">ファンデルヴァー</button>
        <button class="tab" onclick="switchDungeon('madmage')">狂える魔道士</button>
        <button class="tab" onclick="switchDungeon('tomb')">魂を喰らう墓</button>
    </div>

    <div class="card">
        <div class="counter-area">
            <span id="dungeon-title" style="font-weight: bold; font-size: 14px;">ファンデルヴァー</span>
            <span id="dungeon-status" class="status-text status-uncleared">未踏破</span>
        </div>

        <div class="map-wrapper" id="wrapper">
            <img id="card-img" class="bg-card-img" src="phandelver.png" alt="Dungeon Card" onload="adjustScale()">
            <div id="marker-layer" class="marker-container">
                <div id="current-marker" class="marker"></div>
            </div>
        </div>

        <div id="action-area"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    const DEBUG_MODE = false;

    const dungeons = {
        phandelver: {
            name: "ファンデルヴァーの失われた鉱山", image: "phandelver.png", isCleared: false, currentIdx: -1,
            nodes: [
                { id: 0, name: "洞窟の入り口", btnText: "洞窟の入り口 (占術1)", pos: [59, 23, 63, 254], next: [1, 2] },
                { id: 1, name: "ゴブリンの住処", btnText: "左: ゴブリンの住処 (1/1トークン)", pos: [126, 23, 75, 125], next: [3, 4] },
                { id: 2, name: "鉱山のトンネル", btnText: "右: 鉱山のトンネル (宝物)", pos: [126, 152, 75, 125], next: [4, 5] },
                { id: 3, name: "保管庫", btnText: "左: 保管庫 (+1/+1カウンター)", pos: [205, 23, 94, 80], next: [6] },
                { id: 4, name: "暗黒の泉", btnText: "中: 暗黒の泉 (1点ドレイン)", pos: [205, 107, 94, 86], next: [6] },
                { id: 5, name: "キノコの洞窟", btnText: "右: キノコの洞窟 (-4/-0修正)", pos: [205, 197, 94, 80], next: [6] },
                { id: 6, name: "ドゥマトーインの寺院", btnText: "ドゥマトーインの寺院 (1ドロー)", pos: [302, 23, 60, 254], next: [] }
            ]
        },
        madmage: {
            name: "狂える魔道士の迷宮", image: "madmage.png", isCleared: false, currentIdx: -1,
            nodes: [
                { id: 0, name: "大口の門", btnText: "大口の門 (+1点ライフ)", pos: [59, 23, 31, 254], next: [1] },
                { id: 1, name: "ダンジョン階層", btnText: "ダンジョン階層 (占術1)", pos: [94, 23, 28, 254], next: [2, 3] },
                { id: 2, name: "ゴブリンのバザール", btnText: "左: ゴブリンのバザール (宝物)", pos: [126, 23, 58, 122], next: [4] },
                { id: 3, name: "ねじれ洞窟", btnText: "右: ねじれ洞窟 (攻撃制限)", pos: [126, 152, 58, 122], next: [4] },
                { id: 4, name: "失われた階層", btnText: "失われた階層 (占術2)", pos: [190, 23, 28, 254], next: [5, 6] },
                { id: 5, name: "ルーンストーンの洞窟", btnText: "左: ルーンストーン (2枚追放)", pos: [222, 23, 60, 125], next: [7] },
                { id: 6, name: "ミュラルの墓地", btnText: "右: ミュラルの墓地 (1/1×2体)", pos: [222, 152, 60, 125], next: [7] },
                { id: 7, name: "地底鉱山", btnText: "地底鉱山 (占術3)", pos: [285, 23, 28, 254], next: [8] },
                { id: 8, name: "狂える魔道士の住処", btnText: "狂える魔道士の住処 (3ドロー)", pos: [316, 23, 46, 254], next: [] }
            ]
        },
        tomb: {
            name: "魂を喰らう墓", image: "tomb.png", isCleared: false, currentIdx: -1,
            nodes: [
                { id: 0, name: "罠のある入り口", btnText: "罠のある入り口 (全員1点ルーズ)", pos: [59, 23, 63, 254], next: [1, 2] },
                { id: 1, name: "恐怖のヴェール", btnText: "左: 恐怖のヴェール (2点減/ディスカード)", pos: [126, 23, 75, 125], next: [3] },
                { id: 2, name: "土牢", btnText: "右: 土牢 (大量生贄)", pos: [126, 152, 156, 125], next: [4] },
                { id: 3, name: "落砂の監獄", btnText: "左: 落砂の監獄 (2点減/生贄)", pos: [205, 23, 78, 125], next: [4] },
                { id: 4, name: "死神の掘り籠", btnText: "死神の掘り籠 (アトロパル生成)", pos: [286, 23, 75, 254], next: [] }
            ]
        }
    };

    let currentDungeonKey = 'phandelver';

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.innerText = message;
        toast.classList.add('show');
        
        setTimeout(() => {
            toast.classList.toggle('show', false);
        }, 2000);
    }

    function adjustScale() {
        const wrapper = document.getElementById('wrapper');
        const layer = document.getElementById('marker-layer');
        if (!wrapper || !layer) return;
        const currentWidth = wrapper.clientWidth;
        const scale = currentWidth / 300;
        layer.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', adjustScale);

    function render() {
        const dungeon = dungeons[currentDungeonKey];
        
        document.getElementById('dungeon-title').innerText = dungeon.name;
        const statusLabel = document.getElementById('dungeon-status');
        if (dungeon.isCleared) {
            statusLabel.innerText = "踏破済";
            statusLabel.className = "status-text status-cleared";
        } else {
            statusLabel.innerText = "未踏破";
            statusLabel.className = "status-text status-uncleared";
        }
        
        document.getElementById('card-img').src = dungeon.image;

        const marker = document.getElementById('current-marker');
        if (dungeon.currentIdx === -1) {
            marker.style.display = 'none';
        } else {
            const pos = dungeon.nodes[dungeon.currentIdx].pos;
            marker.style.display = 'block';
            marker.style.top = pos[0] + 'px';
            marker.style.left = pos[1] + 'px';
            marker.style.height = pos[2] + 'px';
            marker.style.width = pos[3] + 'px';
        }

        adjustScale();

        const actionArea = document.getElementById('action-area');
        actionArea.innerHTML = '';

        if (dungeon.currentIdx === -1) {
            const exploringDungeon = Object.values(dungeons).find(d => d.currentIdx !== -1);
            
            if (exploringDungeon) {
                const notice = document.createElement('div');
                notice.className = 'lock-notice';
                notice.innerText = `⚠️ 「${exploringDungeon.name}」を探索中のため、このダンジョンには進入できません。`;
                actionArea.appendChild(notice);
            } else {
                const btn = document.createElement('button');
                btn.className = 'btn btn-primary';
                btn.innerText = "🚪 ダンジョンに進入する";
                btn.onclick = () => advance(0);
                actionArea.appendChild(btn);
            }
        } else {
            const currentNode = dungeon.nodes[dungeon.currentIdx];
            
            if (currentNode.next.length === 0) {
                // 👑 DEBUG_MODEがtrueの時だけ手動確認用ボタンを生成。通常本番時（false）は何も描画せず空白にする
                if (DEBUG_MODE) {
                    const btn = document.createElement('button');
                    btn.className = 'btn btn-clear-dungeon';
                    btn.innerText = "🏁 ダンジョンを踏破して外へ出る";
                    btn.onclick = () => {
                        showToast(`「${dungeon.name}」を踏破しました！`);
                        dungeon.isCleared = true;
                        dungeon.currentIdx = -1;
                        render();
                    };
                    actionArea.appendChild(btn);

                    const debugBtn = document.createElement('button');
                    debugBtn.className = 'btn btn-debug';
                    debugBtn.innerText = "⚠️ 【デバッグ用】この位置のまま踏破済にする";
                    debugBtn.onclick = () => {
                        dungeon.isCleared = true;
                        render();
                    };
                    actionArea.appendChild(debugBtn);
                }
            } else {
                currentNode.next.forEach(nextId => {
                    const nextNode = dungeon.nodes.find(n => n.id === nextId);
                    const btn = document.createElement('button');
                    btn.className = 'btn btn-primary';
                    btn.innerText = `➡️ ${nextNode.btnText}`;
                    btn.onclick = () => advance(nextNode.id);
                    actionArea.appendChild(btn);
                });
            }
        }
    }

    function advance(nodeId) {
        const dungeon = dungeons[currentDungeonKey];
        const targetIdx = dungeon.nodes.findIndex(n => n.id === nodeId);
        const targetNode = dungeon.nodes[targetIdx];

        if (targetNode.next.length === 0) {
            dungeon.currentIdx = targetIdx;
            render();
            
            if (!DEBUG_MODE) {
                // 👑 最後のマスに入った瞬間、1秒間手動ボタンを見せずに枠だけを表示。時間が来たら自動で外へ
                setTimeout(() => {
                    showToast(`「${dungeon.name}」を踏破しました！`);
                    dungeon.isCleared = true;
                    dungeon.currentIdx = -1; 
                    render(); 
                }, 1000);
            }
        } else {
            dungeon.currentIdx = targetIdx;
            render();
        }
    }

    function switchDungeon(key) {
        currentDungeonKey = key;
        document.querySelectorAll('.tab').forEach((tab, idx) => {
            tab.classList.toggle('active', ['phandelver', 'madmage', 'tomb'][idx] === key);
        });
        render();
    }

    window.onload = () => {
        render();
    };
</script>

</body>
</html>
